name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Tests and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  apk:
    name: Debug APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: .gradle-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('android/variables.gradle', 'android/build.gradle', 'android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build APK in capgo/capacitor
        env:
          GRADLE_CACHE_DIR: ${{ github.workspace }}/.gradle-cache
        run: ./build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: chess-trainer-debug-apk
          path: dist-apk/chess-trainer-debug.apk
          if-no-files-found: error
          retention-days: 30
